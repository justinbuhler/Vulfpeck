# How this repository builds, read by scripts/harness_config.py. Every key is
# optional; an absent key keeps the default shown in that file. Unknown keys are
# an error. See README.md "Adopting the harness" for other languages.

[project]
name = "vulfpeck"                       # names the lander cache: ~/.cache/<name>-land

[commands]
setup = "uv sync --frozen --quiet"      # before lint and tests; "" to skip
lint = "uvx ruff check ."               # pre-commit, the land gate and CI
test = "./scripts/standalone_tests.sh"  # run by scripts/run.sh
pipeline = ""                           # run.sh without --tests, after the tests

[tests]
# Python regex; the last match's group 1 is the number of checks run. A run that
# exits 0 without reporting a non-zero count fails. "" trusts the exit code.
count_pattern = '(\d+) checks total'

[land]
copy_untracked = []                     # inputs the gate needs that git does not carry

[adr]
dir = "docs/adr"                        # NNNN-slug.md, managed by scripts/adr.py
# A file matching one of these needs a proposed or accepted ADR naming it in
# `Components:`, checked at every land (tests/test_adr.py). Empty: ADRs record real
# decisions and are written when someone chooses to; `scripts/adr.py check` still
# validates the ones that exist. A project that wants coverage lists globs here.
require_for = []
exempt = []

[jev]
enabled = true                          # JEV_DISABLE=1 also turns it off
timeout = 8.0                           # seconds per request

[tiers]
# Floor globs for scripts/jev.py consequence, checked critical, high, medium, low;
# a path matching none is Medium and a change's floor is its highest path. Jev may
# raise the tier, never lower it. Rules and machinery files are High.
low = ["README.md", "ENGINEERING_LOG.md", "HARNESS.md", "docs/**"]
medium = ["docs/adr/**"]
high = [".claude/**", ".agents/**", ".codex/**", ".gemini/**", ".github/**", ".githooks/**",
        "AGENTS.md", "CLAUDE.md", "**/AGENTS.md", "**/CLAUDE.md", "harness.toml",
        "scripts/paths.py", "scripts/harness_config.py", "scripts/jev.py", "scripts/plan_tests.py",
        "scripts/standalone_tests.sh", "scripts/land.sh", "scripts/gate.sh", "scripts/run.sh",
        "mutants/**", "tests/**", "scripts/harness_env.sh", "scripts/adr.py",
        "docs/agents/**", "docs/mutation-testing.md"]
critical = []

[hooks]
watched_files = ["harness.toml", "scripts/paths.py", "scripts/harness_config.py",
                 "scripts/gate.sh", "scripts/land.sh", "scripts/run.sh", ".claude/settings.json"]
watched_dirs = [".githooks/"]
skip_dirs = [".venv", "__pycache__", "node_modules", ".git"]

[[mapped_tests]]
match = "*.py"
self = "*tests/test_*.py"
tests = ["{dir}/tests/test_{name}", "tests/test_{name}"]
command = "uv run --no-sync python3 {test}"

# The hook registration table. scripts/render_hooks.py writes the hooks of
# .claude/settings.json, .codex/hooks.json and .gemini/settings.json from it.
# `command` is the Claude Code command; Codex and Gemini run it through
# scripts/hook_adapter.py. A gate's command ends in `|| {...; exit 2; }` so a crash
# blocks; an advisory's ends in `|| true`. timeout is in seconds.

[[hook]]
name = "require_agent_model_PreToolUse"
event = "PreToolUse"
matcher = "Agent"
kind = "gate"
timeout = 5
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/require_agent_model.py\" || { rc=$?; [ \"$rc\" = 2 ] || echo \"require_agent_model.py crashed (rc=$rc); failing closed\" >&2; exit 2; }"

[[hook]]
name = "model_router_PreToolUse"
event = "PreToolUse"
matcher = "Agent"
kind = "gate"
timeout = 5
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/model_router.py\" || { rc=$?; [ \"$rc\" = 2 ] || echo \"model_router.py crashed (rc=$rc); failing closed\" >&2; exit 2; }"

[[hook]]
name = "blast_radius_advisory_PreToolUse"
event = "PreToolUse"
matcher = "Edit|Write"
kind = "advisory"
timeout = 30
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/blast_radius_advisory.py\" || true"

[[hook]]
name = "queue_guard_PreToolUse"
event = "PreToolUse"
matcher = "Bash"
kind = "advisory"
timeout = 10
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/queue_guard.py\" || true"

[[hook]]
name = "verify_commit_landed_PostToolUse"
event = "PostToolUse"
matcher = "Bash"
kind = "gate"
timeout = 10
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/verify_commit_landed.py\" || { rc=$?; [ \"$rc\" = 2 ] || echo \"verify_commit_landed.py crashed (rc=$rc); failing closed\" >&2; exit 2; }"

[[hook]]
name = "test_for_edited_module_PostToolUse"
event = "PostToolUse"
matcher = "Edit|Write"
kind = "gate"
timeout = 70
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/test_for_edited_module.py\" || { rc=$?; [ \"$rc\" = 2 ] || echo \"test_for_edited_module.py crashed (rc=$rc); failing closed\" >&2; exit 2; }"

[[hook]]
name = "codegraph_freshness_UserPromptSubmit"
event = "UserPromptSubmit"
kind = "advisory"
timeout = 30
command = "out=$(cd \"${CLAUDE_PROJECT_DIR}\" && uv run python3 scripts/codegraph_freshness.py) || printf \"%s\\n\" \"$out\""

[[hook]]
name = "codegraph_freshness_SessionStart"
event = "SessionStart"
matcher = "startup"
kind = "advisory"
timeout = 120
command = "cd \"${CLAUDE_PROJECT_DIR}\" && uv run python3 scripts/codegraph_freshness.py --sync-if-stale || true"

[[hook]]
name = "harness_doctor_SessionStart"
event = "SessionStart"
matcher = "startup"
kind = "advisory"
timeout = 15
command = "python3 \"${CLAUDE_PROJECT_DIR}/scripts/harness_doctor.py\" || true"

[[hook]]
name = "readonly_guard_SubagentStart"
event = "SubagentStart"
kind = "advisory"
timeout = 30
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/readonly_guard.py\" || true"

[[hook]]
name = "readonly_guard_SubagentStop"
event = "SubagentStop"
kind = "advisory"
timeout = 30
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/readonly_guard.py\" || true"

[[hook]]
name = "session_guard_Stop"
event = "Stop"
kind = "advisory"
timeout = 60
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/session_guard.py\" || true"

[[hook]]
name = "session_guard_SessionEnd"
event = "SessionEnd"
kind = "advisory"
timeout = 20
command = "python3 \"${CLAUDE_PROJECT_DIR}/.claude/hooks/session_guard.py\" || true"
